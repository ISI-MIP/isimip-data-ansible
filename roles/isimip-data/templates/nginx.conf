server {
    server_name {{ item.data_url }};

    {% if proxy_host -%}
    set_real_ip_from {{ proxy_host }};
    real_ip_header X-Forwarded-For;

    {% endif -%}

    access_log /var/log/nginx/{{ item.data_url }}.access.log;
    access_log /var/log/nginx/{{ item.data_url }}.access.json.log json;
    error_log /var/log/nginx/{{ item.data_url }}.error.log;

    {% if ssl -%}
    listen [::]:443 ssl;
    listen 443 ssl;

    ssl_certificate /etc/letsencrypt/live/{{ item.data_url }}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{ item.data_url }}/privkey.pem;

    include /etc/nginx/snippets/csp.conf;
    include /etc/nginx/snippets/ssl.conf;
    {% else -%}
    listen [::]:80;
    listen 80;
    {% endif %}

    root /srv/www/htdocs;
    index index.html;

    client_max_body_size 32M;

    proxy_read_timeout 120;
    proxy_connect_timeout 120;
    proxy_send_timeout 120;

    location / {
        # uncomment for maintenance
        # return 503;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_pass http://127.0.0.1:{{ item.gunicorn_port }}/;
    }
    location /static/ {
        add_header "Access-Control-Allow-Origin" *;
        alias /srv/www/{{ item.app }}/static_root/;
    }
    location /media/ {
        alias /srv/www/{{ item.app }}/media_root/;
    }

    include /etc/nginx/snippets/error.conf;
}

{% if ssl %}
server {
    if ($host = {{ item.data_url }}) {
        return 301 https://$host$request_uri;
    }

    server_name {{ item.data_url }};

    listen 80;
    listen [::]:80;
    return 404;
}
{% endif %}
