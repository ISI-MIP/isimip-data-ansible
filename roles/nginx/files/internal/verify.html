<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verifying...</title>
    <style>
        body { font-family: sans-serif; text-align: center; width: 600px; margin: 60px auto; color: #333; }
        span { font-size: 3em }
        h1 { font-size: 1.2em; margin-bottom: 20px; margin-top: 20px; }
        p { margin-top: 20px; margin-bottom: 20px; }
        a { color: rgb(6, 129, 190); }
    </style>
</head>
<body>
    <script>
        document.cookie = 'verified_browser=yes; Path=/' + (location.protocol === 'https:' ? '; SameSite=Lax; Secure' : '');
        window.location.reload();
    </script>

    <noscript>
        <h1>JavaScript required</h1>
        <p>
            This site uses a small JavaScript check to filter out automated traffic before
            serving content. Your browser appears to have JavaScript disabled, so the check
            can't run and you're stuck on this page.
        </p>
        <p>
            To continue, please enable JavaScript and cookies for this site, then
            <a href="">reload the page</a>. No personal data is collected — the check just confirms
            you're using a real browser. If you're using a privacy-focused browser or extension
            that blocks JavaScript by default, you may need to add an exception for this domain.
        </p>
    </noscript>
</body>
</html>
