# $needs_verification = 1 when the request is browser-like (user-agent starts with Mozilla) AND
# has no "verified_browser" cookie. Used as `if ($needs_verification) { return 418; }` in locations.

map $http_user_agent $is_browser {
    default       "";
    "~*^Mozilla"  "B";
}

map $http_cookie $is_verified {
    default               "U";
    "~*verified_browser"  "";
}

# Concatenate markers since nginx `if` has no &&. "BU" = browser + unverified = gate.
map "$is_browser$is_verified" $needs_verification {
    default  0;
    "BU"     1;
}
